name: Update profile card

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, portrait.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light.svg dark.svg stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
